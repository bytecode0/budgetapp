<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- `lang` follows the active i18next language at runtime (src/i18n.ts). -->
    <title>Remanso · Tu dinero, en calma</title>
    <meta
      name="description"
      content="Ve a dónde va tu dinero, págate a ti primero y ahorra cada mes con constancia. Remanso: tu dinero, en calma."
    />
    <meta name="theme-color" content="#F3F6F4" />
    <link rel="icon" type="image/svg+xml" href="/icons/remanso-mark.svg" />
    <!-- Installable on the phone (LPBETA-11). No service worker on purpose:
         no offline mode, so the app never shows stale money data. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Remanso" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    <!-- The CSP in vercel.json allows this script by its sha256: editing it
         means updating that hash (server/middleware/securityHeaders.test.ts
         fails until you do). -->
    <script>
      // Paint the last theme chosen on this device before the app loads, so a
      // dark-mode user never sees a white flash. The server's value (per
      // person, src/app/lib/theme.ts) replaces it after sign-in.
      try {
        if (localStorage.getItem('remanso-theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0E1B19');
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
