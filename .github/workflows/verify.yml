# Typecheck, tests and build on every PR and every push to main. Vercel's Git
# integration deploys on its own (PR → preview, main → production); protect
# `main` in GitHub so a PR can only merge with this check green.
# No database or secrets needed: tests are pure and `prisma generate` only
# reads the schema.
name: verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
